name: Automated Daily Database Backup

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PostgreSQL 17 Client
      run: |
        sudo apt-get update
        sudo apt-get install -y curl ca-certificates
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
        sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
        sudo apt-get update
        sudo apt-get install -y postgresql-client-17

    - name: Run Database Dump
      env:
        DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        mkdir -p backups
        pg_dump "$DATABASE_URL" -v -F c -f backups/nightly_backup.sql

    - name: Upload Backup File as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: supabase-database-backup
        path: backups/nightly_backup.sql
        retention-days: 7